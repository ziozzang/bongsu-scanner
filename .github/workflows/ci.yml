name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * *' # 03:00 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-analysis:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'gofmt required:\n%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go mod verify

  test-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -short -race -count=1 ./...

  test-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux]
        arch: [amd64, arm64]
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: windows
            arch: amd64
          - os: freebsd
            arch: amd64
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          go build ./...
          suffix=''
          if [ "$GOOS" = windows ]; then suffix=.exe; fi
          go build -trimpath -o "dist/bscan_${GOOS}_${GOARCH}${suffix}" ./cmd/bscan
      - uses: actions/upload-artifact@v4
        with:
          name: bscan-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/bscan_${{ matrix.os }}_${{ matrix.arch }}*
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BSCAN_DOCKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 -p 2 ./deploy -run '^TestDockerDefaultUIDDirectoryScan$'
      - name: Build static image and smoke test
        run: |
          docker build --platform linux/amd64 --build-arg VERSION=ci -t bscan:ci .
          sh deploy/container-smoke.sh bscan:ci ci

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
